name: GitHub Pages

# Yalnızca frontend/ yayımlanıyor. Arka uç Modal'da; depoda hiçbir sır yok,
# API adresi ve token uygulamanın ayarlar ekranından giriliyor.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek dağıtım; sıradaki beklesin, çalışan iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: frontend/ klasörünü paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Yayımla
        id: deployment
        uses: actions/deploy-pages@v4
