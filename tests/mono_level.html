<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mono (Tasarruf) şerit seviyesi</title>
<style>body { font: 14px/1.5 system-ui, sans-serif; padding: 16px; background: #0b0d12; color: #dfe3ea; } pre { white-space: pre-wrap; }</style>
</head>
<body>
<h1>Tasarruf (mono) kipinde şerit seviye sıçraması</h1>
<p>GERÇEK <code>Engine</code> + OfflineAudioContext. Aynı mono kaynak: şeritsiz (bypass) ile şeritli (pan 0, EQ neredeyse kimlik) çıkış seviyesi.
Sunucu: <code>python -m http.server 8000</code> (depo kökünde), sayfa: <code>/tests/mono_level.html</code></p>
<pre id="log">başlıyor…</pre>
<script type="module">
// motor dosyası önbelleğe takılmasın (ölçüm tekrarlarında)
const { Engine } = await import(`../frontend/js/engine.js?v=${Date.now()}`);

const logEl = document.getElementById("log");
const say = (text) => { logEl.textContent += `\n${text}`; console.log(text); };
const RATE = 44100;
const SECONDS = 2;

function wav(floats, channels) {
  const bytes = new ArrayBuffer(44 + floats.length * 4);
  const v = new DataView(bytes);
  const str = (o, s) => { for (let i = 0; i < s.length; i += 1) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + floats.length * 4, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 3, true); v.setUint16(22, channels, true);
  v.setUint32(24, RATE, true); v.setUint32(28, RATE * 4 * channels, true); v.setUint16(32, 4 * channels, true);
  v.setUint16(34, 32, true); str(36, "data"); v.setUint32(40, floats.length * 4, true);
  new Float32Array(bytes, 44).set(floats);
  return bytes;
}

// tohumlu gürültü (mulberry32): iki kanal da AYNI (mono-uyumlu), böylece stereo kipte de karşılaştırılabilir
function noise() {
  let a = 0x1234567;
  const rand = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const out = new Float32Array(RATE * SECONDS * 2);
  for (let i = 0; i < RATE * SECONDS; i += 1) {
    const x = (rand() * 2 - 1) * 0.2;
    out[2 * i] = x;
    out[2 * i + 1] = x;
  }
  return out;
}

async function render(mono, fx) {
  const lead = Math.round(0.08 * RATE);
  const offline = new OfflineAudioContext({ numberOfChannels: 2, length: lead + RATE * SECONDS + RATE, sampleRate: RATE });
  offline.resume = async () => {};
  offline.close = async () => {};
  window.AudioContext = function Holder() { return offline; };
  const engine = new Engine();
  engine.monoDownmix = mono;
  const data = noise();
  await engine.loadStems(["A"], async () => wav(data, 2));
  engine.applyMix(new Map([["A", { fader: 100, mute: false, solo: false, ...fx }]]));
  await engine.play();
  const started = Math.round(engine.startedAt * RATE);
  const rendered = await offline.startRendering();
  const channels = [0, 1].map((c) => rendered.getChannelData(c).subarray(started + 4410, started + RATE * SECONDS - 4410));
  const rms = (x) => Math.sqrt(x.reduce((s, v) => s + v * v, 0) / x.length);
  const layout = engine.channels.get("A").buffer.numberOfChannels;
  engine.dispose();
  return { l: rms(channels[0]), r: rms(channels[1]), layout };
}

const db = (x) => 20 * Math.log10(x);
(async () => {
  try {
    const cases = [
      ["şeritsiz (bypass)", {}],
      ["EQ 0,1 dB (şerit bağlı, pan 0)", { eq: [0.1, 0, 0] }],
      ["pan +0,5", { pan: 0.5 }],
      ["pan -0,5", { pan: -0.5 }],
    ];
    for (const mono of [false, true]) {
      say(`--- ${mono ? "MONO (Tasarruf)" : "STEREO (Yüksek)"}`);
      let base = null;
      for (const [label, fx] of cases) {
        const result = await render(mono, fx);
        if (!base) base = result;
        say(`${label}: tampon ${result.layout} kanal, L ${db(result.l).toFixed(2)} dB, R ${db(result.r).toFixed(2)} dB; `
          + `bypass'a göre L ${(db(result.l) - db(base.l)).toFixed(2)} dB, R ${(db(result.r) - db(base.r)).toFixed(2)} dB`);
      }
    }
    say("bitti");
    document.title = "bitti";
  } catch (error) {
    say(`HATA: ${error && error.stack || error}`);
    document.title = "hata";
  }
})();
</script>
</body>
</html>
